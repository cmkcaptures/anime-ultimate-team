<body>
<div id="boot"><div class="bt-in"><b>ANIME<br>ULTIMATE TEAM</b><i><s id="btBar"></s></i><small id="btTx">Loading…</small></div></div>
<div id="backdrop"></div>
<div id="app">
  <header id="top">
    <button class="lvl" id="lvlBtn" aria-label="Your level and missions">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle id="lvlRing" cx="24" cy="24" r="21" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="132"/><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#ff9ecb"/><stop offset=".5" stop-color="#a8ffcf"/><stop offset="1" stop-color="#9ad8ff"/></linearGradient></defs></svg>
      <span class="face" id="lvlNum">1</span><small id="lvlTag">LV</small>
    </button>
    <span class="ptitle" id="ptitle"></span>
    <div class="chips2">
      <span class="cur" id="ppChip" title="Pack Points"><i class="pp-i"></i><span id="ppVal">0</span></span>
      <span class="cur" id="coinChip" title="Coins"><i class="coin-i"></i><span id="coinVal">0</span></span>
    </div>
  </header>
  <main id="pages"></main>
  <button class="fab" id="fab" aria-label="Missions"><svg viewBox="0 0 24 24" fill="none" stroke="#063a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.5h6V4M8.5 12l2.2 2.2L15.5 9.5"/></svg><span>Missions</span><b class="dot" id="fabDot" hidden></b></button>
  <nav id="nav" aria-label="Main">
    <div class="pill" id="navPill"></div>
    <button data-go="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.8 11a1 1 0 0 0 1.3 1.5l.9-.8V20a1 1 0 0 0 1 1h4.5v-5.5h3V21H18a1 1 0 0 0 1-1v-8.3l.9.8A1 1 0 0 0 21.2 11Z"/></svg><span>HOME</span></button>
    <button data-go="cards" aria-label="My cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="4" y="3" width="13" height="17" rx="2"/><path d="M8 7h5M20 7v13a1 1 0 0 1-1 1H8"/></svg><span>CARDS</span></button>
    <button data-go="team" aria-label="My team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="7" r="3.2"/><circle cx="5" cy="10" r="2.4"/><circle cx="19" cy="10" r="2.4"/><path d="M6.5 20a5.5 5.5 0 0 1 11 0M1.5 19a3.6 3.6 0 0 1 5-3.3M22.5 19a3.6 3.6 0 0 0-5-3.3"/></svg><span>TEAM</span></button>
    <button data-go="battle" aria-label="Battle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5 20.5 3.5 20.5 9.5 9 21 3 15Z"/><path d="M7 13l4 4M3.5 20.5l3-3"/></svg><span>BATTLE</span></button>
    <button data-go="shop" aria-label="Shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8Z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg><span>SHOP</span></button>
  </nav>
  <div id="sideProfile"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal" hidden></div>
</div>

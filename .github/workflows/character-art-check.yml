name: Character art check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dimensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for path in sorted(Path('.').glob('image(20261126-*).png')):
              b = path.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', path
              print(path.name, *struct.unpack('>II', b[16:24]))
          PY
